#
#   docker compose -f docker-compose.test.yml up -d --wait
#   pnpm --filter @inrium/backend test
#   docker compose -f docker-compose.test.yml down
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: inrium-postgres-test
    environment:
      POSTGRES_USER: inrium_test
      POSTGRES_PASSWORD: inrium_test_password
      POSTGRES_DB: inrium_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inrium_test -d inrium_test']
      interval: 2s
      timeout: 3s
      retries: 30

  # ???????? SMTP-?????? ??? ?????????????? ????? ????? (test/email-smtp.integration.spec.ts).
  # ??????? `mail`, ??? ???????? ??????? ?????? ?? ???????? ????? ??????????:
  #   docker compose -f docker-compose.test.yml --profile mail up -d --wait mailpit-test
  mailpit-test:
    image: axllent/mailpit:latest
    container_name: inrium-mailpit-test
    profiles:
      - mail
    ports:
      - '127.0.0.1:11025:1025'
      - '127.0.0.1:18025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 15
