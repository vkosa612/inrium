services:
  postgres:
    image: postgres:16-alpine
    container_name: inrium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: inrium-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: inrium-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '4200:4200'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount prisma dir so migrations generated inside container persist to host
      - ./apps/backend/prisma:/app/apps/backend/prisma

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: inrium-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override for server-side rendering inside Docker network
      BACKEND_URL: http://backend:4200/api
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
