# Базовий (production-безпечний) стек: БД без публікації портів, backend не доступний ззовні,
# frontend проксує /api та /uploads до backend. Зручності для розробки (порти, Adminer, Mailpit) —
# у docker-compose.override.yml (підхоплюється автоматично командою `docker compose up`).
# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
name: inrium

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: inrium-backend:local
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      UPLOADS_DIR: /app/uploads
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Завантаження користувачів — іменований том (потрібно включати в резервні копії: scripts/backup.sh).
      - uploads_data:/app/uploads
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4200/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

  frontend:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # Браузер ЗАВЖДИ ходить на same-origin `/api` (проксі Next.js → BACKEND_URL).
        # Не підхоплюємо NEXT_PUBLIC_API_URL з .env: там інколи лишається
        # http://localhost:4200/api для host-side pnpm, і тоді CSP connect-src 'self'
        # блокує клієнтські fetch (Failed to fetch) + cookie стають third-party.
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        # Внутрішня адреса backend: вбудовується в rewrites під час збірки.
        BACKEND_URL: http://backend:4200/api
        NEXT_PUBLIC_CAPTCHA_PROVIDER: ${NEXT_PUBLIC_CAPTCHA_PROVIDER:-}
        NEXT_PUBLIC_CAPTCHA_SITE_KEY: ${NEXT_PUBLIC_CAPTCHA_SITE_KEY:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_ADS_EMAIL: ${NEXT_PUBLIC_ADS_EMAIL:-}
        NEXT_PUBLIC_PRIVACY_EMAIL: ${NEXT_PUBLIC_PRIVACY_EMAIL:-}
        NEXT_PUBLIC_CONTACT_TELEGRAM: ${NEXT_PUBLIC_CONTACT_TELEGRAM:-}
        NEXT_PUBLIC_LEGAL_OPERATOR_NAME: ${NEXT_PUBLIC_LEGAL_OPERATOR_NAME:-}
        NEXT_PUBLIC_LEGAL_OPERATOR_ADDRESS: ${NEXT_PUBLIC_LEGAL_OPERATOR_ADDRESS:-}
    image: inrium-frontend:local
    restart: unless-stopped
    # Навмисно БЕЗ env_file: frontend не повинен отримувати секрети backend (JWT/CSRF/SMTP/БД).
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:4200/api
    ports:
      - '${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
