services:
  postgres:
    image: postgres:16-alpine
    container_name: inrium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bind only to localhost — not accessible from LAN/WAN
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: inrium-adminer
    restart: unless-stopped
    profiles:
      - tools
    ports:
      # Bind only to localhost — never expose to LAN/WAN
      - '127.0.0.1:8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: inrium-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${BACKEND_BIND:-0.0.0.0}:4200:4200'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount prisma dir so migrations generated inside container persist to host
      - ./apps/backend/prisma:/app/apps/backend/prisma
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:4200/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: inrium-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override for server-side rendering inside Docker network
      BACKEND_URL: http://backend:4200/api
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
