name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'

jobs:
  backend:
    name: Backend (lint, unit + integration tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Ізольована БД лише для тестів (db-guard відмовиться працювати з БД без суфікса _test).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inrium_test
          POSTGRES_PASSWORD: inrium_test_password
          POSTGRES_DB: inrium_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U inrium_test -d inrium_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Локальна SMTP-пастка для інтеграційного тесту пошти (реальний SMTP-обмін без зовнішньої доставки).
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 11025:1025
          - 18025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @inrium/shared build

      - name: Prisma generate
        run: pnpm --filter @inrium/backend exec prisma generate

      - name: Typecheck (src + tests)
        run: pnpm --filter @inrium/backend lint

      - name: Tests (unit + integration on isolated Postgres)
        run: pnpm --filter @inrium/backend test --runInBand
        env:
          TEST_DATABASE_URL: postgresql://inrium_test:inrium_test_password@127.0.0.1:55432/inrium_test?schema=public
          MAILPIT_API_URL: http://127.0.0.1:18025
          MAILPIT_SMTP_PORT: '11025'

      - name: Build backend
        run: pnpm --filter @inrium/backend build

      - name: Build ops scripts
        run: pnpm --filter @inrium/backend build:scripts

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @inrium/shared build

      - name: Lint
        run: pnpm --filter @inrium/frontend lint

      - name: Typecheck
        run: pnpm --filter @inrium/frontend typecheck

      - name: Tests
        run: pnpm --filter @inrium/frontend test

      - name: Build
        run: pnpm --filter @inrium/frontend build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          BACKEND_URL: http://backend:4200/api

  docker:
    name: Docker (compose config checks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Compose config (dev)
        run: docker compose config -q
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci

      - name: Compose config (production overlay requires secrets)
        # Негативна перевірка: без секретів prod-конфігурація має відхилятися.
        run: |
          if docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q 2>/dev/null; then
            echo "prod compose must fail without required secrets" >&2
            exit 1
          fi
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci

  e2e:
    name: E2E (Docker stack + API smoke + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend, frontend]
    env:
      E2E_PORT: '3300'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Generate throwaway .env (CI only, no real secrets)
        run: |
          rnd() { node -e "console.log(require('crypto').randomBytes(36).toString('base64url'))"; }
          PW="$(rnd)"
          {
            echo "NODE_ENV=development"
            echo "POSTGRES_USER=ci"
            echo "POSTGRES_PASSWORD=${PW}"
            echo "POSTGRES_DB=ci"
            echo "DATABASE_URL=postgresql://ci:${PW}@postgres:5432/ci?schema=public"
            echo "CORS_ORIGIN=http://localhost:${E2E_PORT}"
            echo "SITE_URL=http://localhost:${E2E_PORT}"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:${E2E_PORT}"
            echo "JWT_ACCESS_SECRET=$(rnd)$(rnd)"
            echo "JWT_REFRESH_SECRET=$(rnd)$(rnd)"
            echo "CSRF_SECRET=$(rnd)$(rnd)"
            echo "TRUSTED_PROXY_HOPS=1"
            echo "FRONTEND_PORT=${E2E_PORT}"
          } > .env

      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: API smoke (real HTTP through the frontend proxy)
        run: node scripts/smoke-api.mjs "http://localhost:${E2E_PORT}"

      - name: Install dependencies and Playwright browser
        run: |
          pnpm install --frozen-lockfile --filter @inrium/frontend...
          pnpm --filter @inrium/frontend exec playwright install --with-deps chromium

      - name: Browser e2e
        run: pnpm --filter @inrium/frontend e2e
        env:
          E2E_BASE_URL: http://localhost:3300

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop stack
        if: always()
        run: docker compose down -v
